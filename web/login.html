<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Netcradus LLM | Login</title>

    <meta name="description" content="Secure Login for Netcradus LLM">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="background-glow"></div>

    <div class="login-container">

        <div class="login-card">

            <img src="image/logo.png" class="logo" alt="Netcradus">

            <h1>Netcradus <span>LLM</span></h1>

            <p class="subtitle">
                Secure AI Platform for Enterprise Cybersecurity
            </p>

            <div id="authMessage" class="message"></div>

            <!-- Tabs -->

            <div class="tabs">

                <button class="tab active" id="loginTab">
                    Sign In
                </button>

                <button class="tab" id="signupTab">
                    Create Account
                </button>

            </div>

            <!-- LOGIN -->

            <form id="loginForm">

                <input id="loginEmail" type="email" placeholder="Email Address" required>

                <div class="password-wrapper">

                    <input id="loginPassword" type="password" placeholder="Password" required>

                    <button type="button" class="togglePassword" data-target="loginPassword">

                        👁

                    </button>

                </div>

                <div class="row">

                    <label>

                        <input type="checkbox" id="rememberMe">

                        Remember Me

                    </label>

                    <a href="#" id="forgotPassword">

                        Forgot Password?

                    </a>

                </div>

                <button class="primary-btn">

                    Sign In

                </button>

            </form>

            <!-- SIGNUP -->

            <form id="signupForm" style="display:none;">

                <input id="signupName" type="text" placeholder="Full Name" required>

                <input id="signupEmail" type="email" placeholder="Email Address" required>

                <div class="password-wrapper">

                    <input id="signupPassword" type="password" placeholder="Password" required>

                    <button type="button" class="togglePassword" data-target="signupPassword">

                        👁

                    </button>

                </div>

                <button class="primary-btn">

                    Create Account

                </button>

            </form>

            <div class="divider">

                <span>OR</span>

            </div>

            <button id="googleLogin" class="google-btn">

                Continue with Google

            </button>

            <div class="footer">

                Protected by Firebase Authentication

            </div>

        </div>

    </div>

    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="login.js"></script>

</body>

</html>
