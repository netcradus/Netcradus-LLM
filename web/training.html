<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netcradus Training Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="training.css">
</head>
<body>

<!-- ========== HEADER ========== -->
<header class="tp-header">
  <div class="tp-header-brand">
    <img src="image/logo.png" class="official-brand-logo" alt="NETCRADUS™ Logo">
    <h1>Training Panel</h1>
  </div>
  <div class="tp-header-actions">
    <button class="btn-icon" id="btn-theme-toggle" title="Toggle theme">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="theme-icon"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
    <span class="status-dot" id="status-dot"></span>
    <span class="status-text" id="status-text">Online</span>
  </div>
</header>

<!-- ========== TAB NAVIGATION ========== -->
<nav class="tp-tabs">
  <button class="tp-tab active" data-tab="datasets">Datasets</button>
  <button class="tp-tab" data-tab="training">Training</button>
  <button class="tp-tab" data-tab="checkpoints">Checkpoints</button>
  <button class="tp-tab" data-tab="logs">Logs</button>
</nav>

<!-- ========== MAIN CONTENT ========== -->
<main class="tp-content" id="tp-content">
  <!-- Tab content injected by JS -->
</main>

<!-- Toast container -->
<div id="toast-container" class="toast-container"></div>

<script src="training.js"></script>
</body>
</html>
