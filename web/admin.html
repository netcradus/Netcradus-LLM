<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netcradus Admin Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- ========== LOGIN VIEW ========== -->
<div id="login-view" class="login-view">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-logo">N</div>
      <h1>Netcradus Admin</h1>
      <p>Sign in to manage your LLM</p>
    </div>
    <form id="login-form" class="login-form" autocomplete="off">
      <div class="form-group">
        <label for="login-username">Username</label>
        <input id="login-username" type="text" placeholder="admin" required autofocus>
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input id="login-password" type="password" placeholder="••••••••" required>
      </div>
      <div id="login-error" class="login-error" style="display:none;"></div>
      <button type="submit" class="btn btn-primary btn-full">Sign In</button>
    </form>
    <p class="login-footer">Default credentials are set on first run. Change password after login.</p>
  </div>
</div>

<!-- ========== ADMIN APP VIEW ========== -->
<div id="app-view" class="admin-layout" style="display:none;">

  <!-- Sidebar -->
  <aside class="admin-sidebar" id="admin-sidebar">
    <div class="sidebar-brand">
      <div class="brand-logo">N</div>
      <span class="brand-text">Netcradus Admin</span>
    </div>
    <nav class="sidebar-nav">
      <a href="#dashboard" class="nav-item active" data-section="dashboard">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a href="#users" class="nav-item" data-section="users">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Users
      </a>
      <a href="#llm" class="nav-item" data-section="llm">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        LLM Management
      </a>
      <a href="#settings" class="nav-item" data-section="settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0-1-1.51V3a2 2 0 0 0-2 2z"/></svg>
        Model Settings
      </a>
      <a href="#training" class="nav-item" data-section="training">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        Training
      </a>
      <a href="#logs" class="nav-item" data-section="logs">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        Logs
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="user-avatar" id="sidebar-user-avatar">A</div>
        <div class="user-info">
          <span class="user-name" id="sidebar-username">Admin</span>
          <span class="user-role" id="sidebar-role">Administrator</span>
        </div>
      </div>
      <button class="btn btn-ghost btn-full" id="btn-logout">Log Out</button>
    </div>
  </aside>

  <!-- Main area -->
  <div class="admin-main">
    <header class="admin-topbar">
      <button class="btn-icon hamburger" id="btn-hamburger" title="Toggle menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <h2 class="section-title" id="section-title">Dashboard</h2>
      <div class="topbar-right">
        <span class="status-dot" id="status-dot" title="System status"></span>
        <span class="status-text" id="status-text">Online</span>
      </div>
    </header>

    <main class="admin-content" id="admin-content">
      <!-- Sections injected by JS -->
    </main>
  </div>
</div>

<!-- Toast container -->
<div id="toast-container" class="toast-container"></div>

<script src="admin.js"></script>
</body>
</html>
